[project]
name = "Gawa"
version = "0.9.0"
description = "Cross-platform GUI for converting to animated GIF, WebP, AVIF, and APNG"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.10"
authors = [
    { name = "SameerChaudry" }
]
dependencies = [
    "PySide6>=6.8.0",
    "Pillow>=11.3.0",
]

[project.urls]
Homepage = "https://github.com/SameerChaudry/Gawa"

[project.scripts]
gawa = "main:main"