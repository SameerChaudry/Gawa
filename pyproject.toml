# Build metadata is for installable copies via uv tool, pipx, AUR
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Gawa"
version = "2.0.0"
description = "Cross-platform GUI for converting to animated GIF, WebP, AVIF, and APNG"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.12"
authors = [
    { name = "SameerChaudry" }
]
dependencies = [
    # Only Essentials is used since the PySide6 mpackage also pulls Addons, WebEngine, and PDF
    # Both floor and ceiling gets tested on each version release. Ceiling also gets bumped on each one 
    "PySide6-Essentials>=6.11.2,<=6.12.1",
    "Pillow>=12.3.0,<=13.0.1",
]

[project.urls]
Homepage = "https://github.com/SameerChaudry/Gawa"

# Installs a "gawa" launcher. gui-scripts uses pythonw on Windows, so no console window appears.
[project.gui-scripts]
gawa = "gawa.app:main"

# Explicit package list avoids setuptools trying to auto-discover unrelated directories like ignore/
[tool.setuptools]
packages = ["gawa"]

# gawa.svg is loaded at runtime by gawa/app.py
[tool.setuptools.package-data]
gawa = ["gawa.svg"]
